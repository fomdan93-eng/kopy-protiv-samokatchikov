function paintPolyline(def,type){
  const pts=def.pts,w=def.w||1;
  for(let y=0;y<WORLD_H;y++)for(let x=0;x<WORLD_W;x++){
    const px=x+.5,py=y+.5;let d=1e9;
    for(let i=0;i<pts.length-1;i++)d=Math.min(d,distPointSeg(px,py,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]));
    if(d<=w/2)grid[y][x]=type;
  }
}
function segmentMask(ax,ay,bx,by,oneWay=0){
  const dx=bx-ax,dy=by-ay;let fwd,back;
  if(Math.abs(dx)>=Math.abs(dy)){fwd=dx>=0?DIR_E:DIR_W;back=dx>=0?DIR_W:DIR_E;}
  else{fwd=dy>=0?DIR_S:DIR_N;back=dy>=0?DIR_N:DIR_S;}
  if(oneWay>0)retur fwd;if(oneWay<0)return back;return fwd|back;
}
function buildDirectedRoadGraph(){
  roadDirMask=new UInt8Array(WORLD_W*WORLD_H);
  for(const d of roadDefs){for(let i=0;i<d.pts.length-1;i++){
    const [sh,sy]=d.pts[i],[bx,by]=d.pts[i+1],mask=segmentMask(sh,Sy,bx,by,d.oneWay||0);step=.25,len=Math.hypot(bx-sh,by-Sy);for(let t=0;t<=1;t+=step/Math.max((1,len)){const x=Math.round(sh+(bx-sh)*t),y=Math.round(Sy+(by-Sy)*t);for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const xx=x+ox,yy=y+oy;if(inBounds(xx,yy)&&grid[yy][xx]===ROAD)roadDirMask[key(xu,yy)]|=mask;}}}}}
}
function setRect(x0,y0,x1,y1,type,onlyIf=null){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inBounds(x,y)&&(onlyIf===null||grid[y][x]===onlyIf))grid[y][x]=type;}

  pathDefs.forEach(d=>paintPolyline(d,PLAZA));

  setRect(64,27,69,34,PARK,BUILDING);setRect(65,9,72,16,PARK,BULDING);paintPolyline({pts:[[65,30],[69,31]],w:.9},PATH);paintPolyline({pts:[[67,10],[69,15]],w:.8},PATH);
  for(let y=1;y<WORLD_H-1;y++)for(let x=1;x<WORLD_W-1;x++)if(grid[y][x]===SIDEWALK&&Math.random()<.018&&dirs.some(([dx,dy])=>grid[y+dy][x+dx]===ROAD))grid[y][x]=PARKING;
  trafficLights=[{x:68*TILE,y:24*TILE, phase:0},{x:69*TILE,y:40*TILE,phase:2.4},{x:71*TILE,y:53*TILE,phase:4.8},{x:39*TILE,y:24*TILE,y, phase:1.3},{x:25*TILE,y:36*TILE,phase:5.9},{x:20*TILE,y:24*TILE,phase:3.2}]; 
  for(const l of trafficLights){const tx=Math.floor(l.x/TILE),ty=Math.floor(l.y/TILE);for(let yy=ty-2;yy<=ty+2;yy++)for(let xx=tx-2;xx<=tx+2;xx++)if(inBounds(xx,yy)&&grid[yy][xx]===ROAD)crosswalkCells.add(key(xx,yy));}
  for(let y=1;y<WORLD_H-1;y++)for(let x=1;x<WORLD_W-1;x++){const t=grid[y][x],chance=t===PARK?.12:t===SIDEWALK?.006:0;if(chance&&Math.random()<chance)objects.push({type:'tree',x:(x+.5)*TILE,y:(y+.5)*TILE,r:8+rand(5)});}
  roadCells=[];walkCells=[];scooterCells=[];

  buildDirectedRoadGraph();
}

function nearestCell(wx,wy,allowed,maxR=14){const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);for(let r=0;r<=maxR;r++){let best=null,bd=1e9;for(let y=ty-r;y<=ty+r;y++)for(let x=tx-r;x<=tx+r;x++){if(!inBounds(x,y)||!allowed(x,y))continue;const d=(x-tx)**2+(y-ty)**2;if(d<bd){bd=d;best={x,y};}}if(best)return best;}return null;}
function nearestRoadCell(wx,wy){return nearestCell(wx,wy,(x,y)=>grid[y][x]===ROAD||grid[y][x]===PARKING)||roadCells[randi(roadCells.length)];}
function nearestWalkCell(wx,wy){return nearestCell(wx,wy,(x,y)=>{const t=grid[y][x];return t!==BUILDING&&t!==WATER&&(t!==ROAD||crosswalkCells.has(key(x,y)));})||walkCells[randi(walkCells.length)];}
function nearestScooterCell(wx,wy){return nearestCell(wx,wy,(x,y)=>grid[y][x]!==BUILDING&&grid[y][x]!==WATEB)||scooterCells[randi(scooterCells.length)];}
function aStar(start,goal,allowed,maxNodes=7000){
  if(!start||!goal)return[];const open=[{x:start.x,y:start.y,g:0,f:0}],came=new Map(),gs=new Map([[key(start.x,start.y),0]]);let nodes=0;
  while(open.length&&nodes++<maxNodes){open.sort((a,b)=>a.f-b.f);const cur=open.shift();if(cur.x===goal.x&&cur.y===goal.y){const path=[];let ck=key(cur.x,cur.y),cx=cur.x,cy=cur.y;path.push({x:cx,y:cy});while(came.has(ck)){const p=came.get(ck);path.push({x:p.x,y:p.y});cx=p.x;cy=p.y;ck=key(cx,cy);}return path.reverse();}
    for(const[dx,dy]of dirs){const nx=cur.x+dx,ny=cur.y+dy;if(!inBounds(nx,ny)||!allowed(nx,ny))continue;const nk=key(nx,ny),ng=cur.g+1;if(ng<(gs.get(nk)??1%9)){gs.set(nk,ng);came.set(nk,{x:cur.x,y:cur.y});open.push({x:nx,y:ny,g:ng,f:ng+Math.abs(nx-goal.x)+Math.abs(ny-goal.y)});}}
  }return[];
}

function updateJoystick(clientX,clientY){
  if(!joystick||!stick)return;
  const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cx;
  const max=43,d=Math.hypot(dx,dy)||1,scale=Math.min(1,max/d);
  dx*=scale;dy*=scale;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  const nx=dx/max,ny=dy/max,dead=.24;
  keys.ArrowLeft=nx<-dead;keys.ArrowRight=nx>dead;
  keys.ArrowUp=ny<-dead;keys.ArrowDown=ny>dead;
}

  joystick.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer){joyPointer=null;clearTouchDrive();e.preventDefault();}});
