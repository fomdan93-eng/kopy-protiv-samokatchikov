<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Копы против Самокатчиков — кооп P2P</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui;display:grid;place-items:center}#s{text-align:center;padding:24px}small{opacity:.7}</style></head><body><div id="s"><b>Готовлю кооп…</b><br><small>Загружаю Китай-город</small></div><script>(async()=>{try{let t=await fetch('./index.html?v=10',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});t=t.replace(/<script>\s*if\('serviceWorker'[\s\S]*?<\/script>/,'');t=t.replace("devicePixelRatio||1","window.devicePixelRatio||1");t=t.replace("kind:'car',laneOffset:","kind:'car',routeDelay:rand(2.8),laneOffset:");t=t.replace("laneOffset:(Math.random()<.5?-9:9),kind:'bus'","routeDelay:rand(3.2),laneOffset:(Math.random()<.5?-9:9),kind:'bus'");t=t.replace("pathCooldown:rand(1),fallen:0,color:","pathCooldown:rand(1),routeDelay:rand(3.4),fallen:0,color:");t=t.replace(/function updateRoadVehicle\(v,dt,now\)\{[\s\S]*?\}\nfunction updateTraffic/,`function updateRoadVehicle(v,dt,now){if(!v.path||v.path.length<2){v.routeDelay=Math.max(0,(v.routeDelay||0)-dt);v.speed+=(0-v.speed)*Math.min(1,dt*4);if(v.routeDelay>0)return;const st=nearestRoadCell(v.x,v.y);let g=roadCells[randi(roadCells.length)];for(let tries=0;tries<12&&Math.abs(g.x-st.x)+Math.abs(g.y-st.y)<22;tries++)g=roadCells[randi(roadCells.length)];v.path=(typeof aStarRoadDirected==='function'?aStarRoadDirected(st,g,2200):aStar(st,g,roadAllowed,2200));v.routeDelay=.45+rand(1);if(!v.path||v.path.length<2)return}const curr=v.path[0],next=v.path[1],wp=worldFromCell(next);let tx=wp.x,ty=wp.y,ox=v.laneOffset||0;if(next.x!==curr.x)ty+=ox;else if(next.y!==curr.y)tx+=ox;const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy)||1,desired=Math.atan2(dy,dx);let da=((desired-v.angle+Math.PI*3)%(Math.PI*2))-Math.PI;v.angle+=clamp(da,-2*dt,2*dt);let target=(mustStopAtLight(v,now)||carAhead(v))?0:v.max;v.speed+=(target-v.speed)*Math.min(1,dt*2.8);v.vx=Math.cos(v.angle)*v.speed;v.vy=Math.sin(v.angle)*v.speed;moveRoadEntity(v,v.vx*dt,v.vy*dt);if(v.blocked){v.path=[];v.routeDelay=.7+rand(.9);v.speed*=.2;return}if(d<14)v.path.shift()}\nfunction updateTraffic`);t=t.replace(/p\.path=aStar\(s,goal,pedestrianAllowed,4200\)/g,"p.path=aStar(s,goal,pedestrianAllowed,1800)");t=t.replace(/c\.path=aStar\(nearestRoadCell\(c\.x,c\.y\),targetForCar\(c\),roadAllowed,6000\)/g,"c.path=aStar(nearestRoadCell(c.x,c.y),targetForCar(c),roadAllowed,2600)");const inject="\n// ---- Native WebRTC multiplayer runtime ----\nconst MP={started:false,host:false,pc:null,conn:null,room:'P2P',other:null,remote:{ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false},lastState:0,lastInput:0};\nconst _update=update,_reset=resetGame,_collide=collideEntities,_drawPlayer=drawPlayer;\nfunction mpRiders(){return MP.other?[player,MP.other]:[player]}\nfunction mpNearest(x,y){let b=player,bd=Infinity;for(const r of mpRiders()){const d=(r.x-x)**2+(r.y-y)**2;if(d<bd){bd=d;b=r}}return b}\ntargetForCar=function(c){const r=mpNearest(c.x,c.y);let tx=r.x,ty=r.y;if(c.mode==='intercept'){tx+=r.vx*2.6;ty+=r.vy*2.6}else if(c.mode==='block'){tx+=r.vx*4;ty+=r.vy*4}return nearestRoadCell(tx,ty)};\nmaybeSpawnFootCop=function(c){if(c.spawnedCop)return;const r=mpNearest(c.x,c.y),d=Math.hypot(c.x-r.x,c.y-r.y),ps=tileAtWorld(r.x,r.y);if(d<180&&(d<90||ps===SIDEWALK||ps===PARK||ps===PATH||ps===PLAZA)){c.spawnedCop=true;const stamina=9.2+rand(1.6);footCops.push({x:c.x+Math.cos(c.angle+Math.PI/2)*22,y:c.y+Math.sin(c.angle+Math.PI/2)*22,r:9,speed:68,returnSpeed:52,vx:0,vy:0,stamina,maxStamina:stamina,returning:false,owner:c,path:[],pathT:0})}};\nfunction mpSpawnOther(){const p=worldFromCell(nearestScooterCell(player.x+80,player.y+30));MP.other={x:p.x,y:p.y,vx:0,vy:0,r:10,angle:0,max:150,accel:3.35,fallen:0,carHitCooldown:0,pedHitCooldown:0,slow:0}}\nfunction mpMove(r,k,dt){if(!r)return;if(r.carHitCooldown>0)r.carHitCooldown-=dt;if(r.pedHitCooldown>0)r.pedHitCooldown-=dt;if(r.slow>0)r.slow-=dt;if(r.fallen>0){r.fallen-=dt;r.vx=r.vy=0;return}const ix=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0),iy=(k.ArrowDown?1:0)-(k.ArrowUp?1:0),L=Math.hypot(ix,iy),surf=tileAtWorld(r.x,r.y);let mx=r.max;if(surf===PARK||surf===GRASS)mx*=.84;if(surf===PATH||surf===SIDEWALK||surf===PLAZA)mx*=.97;if(r.slow>0)mx*=.58;const sp=Math.hypot(r.vx,r.vy);if(L){const dx=ix/L,dy=iy/L,a=Math.atan2(dy,dx);let da=((a-r.angle+Math.PI*3)%(Math.PI*2))-Math.PI;r.angle+=da*Math.min(1,dt*11);const va=sp>4?Math.atan2(r.vy,r.vx):a,td=Math.abs(((a-va+Math.PI*3)%(Math.PI*2))-Math.PI),rain=weather&&weather.type==='rain'&&(surf===ROAD||surf===PARKING||surf===SIDEWALK)?.62:1,g=((sp>62&&td>.62)?1.36:r.accel)*rain,K=Math.min(1,g*dt);r.vx+=(dx*mx-r.vx)*K;r.vy+=(dy*mx-r.vy)*K}else{const dr=Math.pow(weather&&weather.type==='rain'?.969:.958,dt*60);r.vx*=dr;r.vy*=dr}const ns=Math.hypot(r.vx,r.vy);if(ns>mx){r.vx*=mx/ns;r.vy*=mx/ns}moveCircle(r,r.vx*dt,r.vy*dt)}\nfunction mpFall(r){if(r.carHitCooldown>0||r.fallen>0)return;r.fallen=2;r.carHitCooldown=2.35;r.vx=r.vy=0}\nfunction mpCheck(r){if(!r||gameOver)return;const onRoad=tileAtWorld(r.x,r.y)===ROAD;for(const c of policeCars)if((onRoad||r.fallen>0)&&Math.hypot(r.x-c.x,r.y-c.y)<r.r+c.r+3)return lose('ОДНОГО ИЗ ВАС ПОЙМАЛИ');for(const f of footCops)if(!f.returning&&Math.hypot(r.x-f.x,r.y-f.y)<r.r+f.r+2)return lose('ОДНОГО ИЗ ВАС ДОГНАЛ КОП');for(const t of traffic.concat(buses))if(Math.hypot(r.x-t.x,r.y-t.y)<r.r+t.r+3){mpFall(r);return}if(r.fallen<=0&&r.pedHitCooldown<=0)for(const p of pedestrians)if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+p.r+3){r.vx*=.28;r.vy*=.28;r.slow=.95;r.pedHitCooldown=.8;p.stun=.6;break}}\ncollideEntities=function(){_collide();if(!gameOver&&MP.other)mpCheck(MP.other)};\nfunction mpDrawOther(){const r=MP.other;if(!r)return;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-13,0,5,0,Math.PI*2);ctx.arc(14,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#22b8cf';ctx.fillRect(-10,-4,19,8);ctx.strokeStyle='#343434';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(13,0);ctx.stroke();ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(11,-8);ctx.lineTo(11,8);ctx.stroke();ctx.fillStyle='#f1c7a5';ctx.beginPath();ctx.arc(-2,0,5.5,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.fillStyle='#111d';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText('ДРУГ',r.x,r.y-20);ctx.restore()}\ndrawPlayer=function(){_drawPlayer();mpDrawOther()};\nfunction mpSlim(a,fs){return a.map(o=>{const z={};for(const f of fs)z[f]=o[f];return z})}\nfunction mpR(r){return r?{x:r.x,y:r.y,vx:r.vx,vy:r.vy,angle:r.angle,fallen:r.fallen,slow:r.slow,carHitCooldown:r.carHitCooldown,pedHitCooldown:r.pedHitCooldown,r:r.r,max:r.max,accel:r.accel}:null}\nfunction mpState(now){return{t:'s',e:(gameOver?endTime:now)-startTime,g:gameOver,w:weather,a:mpR(player),b:mpR(MP.other),pc:mpSlim(policeCars,['x','y','angle','r','mode']),fc:mpSlim(footCops,['x','y','r','stamina','maxStamina','returning']),tr:mpSlim(traffic,['x','y','angle','r','color']),bu:mpSlim(buses,['x','y','angle','r']),pe:mpSlim(pedestrians,['x','y','r','shirt','skin']),sc:mpSlim(npcScooters,['x','y','r','angle','fallen','color'])}}\nfunction mpCopy(dst,s,soft){if(!s)return dst;if(!dst)dst={...s};if(soft){const d=Math.hypot(dst.x-s.x,dst.y-s.y),q=d>120?1:.35;dst.x+=(s.x-dst.x)*q;dst.y+=(s.y-dst.y)*q;dst.vx=s.vx;dst.vy=s.vy;dst.angle=s.angle}else Object.assign(dst,s);dst.r=s.r||10;dst.max=s.max||150;dst.accel=s.accel||3.35;dst.fallen=s.fallen||0;return dst}\nfunction mpApply(s){weather=s.w||weather;gameOver=!!s.g;startTime=performance.now()-(s.e||0);if(gameOver)endTime=performance.now();player=mpCopy(player,s.b,true);MP.other=mpCopy(MP.other,s.a,false);policeCars=s.pc||[];footCops=s.fc||[];traffic=s.tr||[];buses=s.bu||[];pedestrians=s.pe||[];npcScooters=s.sc||[]}\nfunction mpSendInit(){if(MP.conn&&MP.conn.open)MP.conn.send({t:'i',o:objects,s:mpState(performance.now())})}\nresetGame=function(){if(MP.started&&!MP.host){if(MP.conn&&MP.conn.open)MP.conn.send({t:'r'});return}_reset();if(MP.started&&MP.host){mpSpawnOther();mpSendInit()}};\nupdate=function(dt,now){if(!MP.started)return;if(MP.host){if(!gameOver){mpMove(MP.other,MP.remote,dt);_update(dt,now)}if(MP.conn&&MP.conn.open&&now-MP.lastState>125){MP.lastState=now;MP.conn.send(mpState(now))}}else{if(!gameOver)updatePlayer(dt);if(MP.conn&&MP.conn.open&&now-MP.lastInput>50){MP.lastInput=now;MP.conn.send({t:'k',u:!!keys.ArrowUp,d:!!keys.ArrowDown,l:!!keys.ArrowLeft,r:!!keys.ArrowRight})}}};\nfunction rtcConfig(){return{iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]}}\nfunction packDesc(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}\nfunction unpackDesc(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}\nfunction waitIce(pc){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(res=>{let done=false;const f=()=>{if(!done&&pc.iceGatheringState==='complete'){done=true;pc.removeEventListener('icegatheringstatechange',f);res()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(()=>{if(!done){done=true;pc.removeEventListener('icegatheringstatechange',f);res()}},6500)})}\nfunction wrapDC(dc){const handlers={open:[],data:[],close:[]};dc.addEventListener('open',()=>handlers.open.forEach(f=>f()));dc.addEventListener('message',e=>{let d;try{d=JSON.parse(e.data)}catch{return}handlers.data.forEach(f=>f(d))});dc.addEventListener('close',()=>handlers.close.forEach(f=>f()));return{get open(){return dc.readyState==='open'},send(o){if(dc.readyState==='open')dc.send(JSON.stringify(o))},on(e,f){(handlers[e]||[]).push(f)}}}\nfunction mpBindHost(c){MP.conn=c;c.on('open',()=>{MP.started=true;resetGame();mpHide();mpSendInit()});c.on('data',d=>{if(d.t==='k')MP.remote={ArrowUp:d.u,ArrowDown:d.d,ArrowLeft:d.l,ArrowRight:d.r};if(d.t==='r')resetGame()});c.on('close',()=>showMsg('ДРУГ ОТКЛЮЧИЛСЯ',2000))}\nfunction mpBindGuest(c){MP.conn=c;c.on('open',()=>{MP.started=true;mpHide()});c.on('data',d=>{if(d.t==='i'){if(d.o)objects=d.o;if(d.s)mpApply(d.s)}else if(d.t==='s')mpApply(d)});c.on('close',()=>showMsg('СВЯЗЬ ПОТЕРЯНА',2000))}\nfunction mpStatus(x){const e=document.getElementById('mpstatus');if(e)e.textContent=x}\nfunction mpHide(){document.getElementById('mpl')?.remove();showMsg('МУЛЬТИПЛЕЕР P2P',1800)}\nasync function copyBox(id){const e=document.getElementById(id);e.select();try{await navigator.clipboard.writeText(e.value);mpStatus('Скопировано. Отправь другу.')}catch{document.execCommand('copy');mpStatus('Скопировано.')}}\nasync function shareBox(id){const v=document.getElementById(id).value;if(!v)return;if(navigator.share)try{await navigator.share({title:'Копы против Самокатчиков',text:v})}catch{}else copyBox(id)}\nasync function mpHostCreate(){try{MP.host=true;MP.pc=new RTCPeerConnection(rtcConfig());const dc=MP.pc.createDataChannel('game',{ordered:true});mpBindHost(wrapDC(dc));await MP.pc.setLocalDescription(await MP.pc.createOffer());mpStatus('Собираю сетевой код…');await waitIce(MP.pc);document.getElementById('offerOut').value=packDesc(MP.pc.localDescription);document.getElementById('hostStep2').style.display='block';mpStatus('Отправь приглашение другу. Потом вставь его ответ ниже.')}catch(e){mpStatus('Ошибка: '+e.message)}}\nasync function mpHostAccept(){try{const v=document.getElementById('answerIn').value.trim();if(!v)return mpStatus('Вставь ответ друга.');await MP.pc.setRemoteDescription(unpackDesc(v));mpStatus('Ответ принят. Жду прямое соединение…')}catch(e){mpStatus('Не удалось принять ответ: '+e.message)}}\nasync function mpGuestAnswer(){try{MP.host=false;const v=document.getElementById('offerIn').value.trim();if(!v)return mpStatus('Вставь приглашение друга.');MP.pc=new RTCPeerConnection(rtcConfig());MP.pc.addEventListener('datachannel',e=>mpBindGuest(wrapDC(e.channel)));await MP.pc.setRemoteDescription(unpackDesc(v));await MP.pc.setLocalDescription(await MP.pc.createAnswer());mpStatus('Собираю ответ…');await waitIce(MP.pc);document.getElementById('answerOut').value=packDesc(MP.pc.localDescription);document.getElementById('guestStep2').style.display='block';mpStatus('Отправь этот ответ создателю игры. После его вставки соединение запустится само.')}catch(e){mpStatus('Не удалось создать ответ: '+e.message)}}\nfunction mpUI(){const s=document.createElement('style');s.textContent='#mpl{position:fixed;inset:0;z-index:999;background:#0d1116f7;color:#fff;display:grid;place-items:center;font-family:system-ui;overflow:auto;padding:18px}#mpc{width:min(620px,94vw);background:#171c23;padding:22px;border-radius:22px;border:1px solid #ffffff22;box-shadow:0 25px 70px #0009}#mpc h2{margin:0 0 8px}#mpc p{color:#bbc3ce;font-size:14px;line-height:1.4}.panel{border-top:1px solid #ffffff1d;padding-top:14px;margin-top:12px}.mpb{height:46px;border:0;border-radius:12px;background:#ed5a32;color:#fff;padding:0 14px;font-weight:800}.mpb.secondary{background:#2c3542}textarea{width:100%;min-height:88px;background:#0d1116;color:#dce6f2;border:1px solid #ffffff20;border-radius:12px;padding:10px;font:11px ui-monospace,monospace;resize:vertical}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}#mpstatus{font-size:13px;color:#c8d0da;margin-top:12px;padding:10px;background:#0d1116;border-radius:10px}';document.head.appendChild(s);const d=document.createElement('div');d.id='mpl';d.innerHTML='<div id="mpc"><h2>Кооп на двоих · P2P</h2><p>Без сервера комнат. Вы один раз обмениваетесь кодами, после чего телефоны соединяются напрямую.</p><div class="panel"><b>Если ТЫ создаёшь игру</b><div class="row"><button class="mpb" id="hostCreate">1. СОЗДАТЬ ПРИГЛАШЕНИЕ</button></div><textarea id="offerOut" readonly placeholder="Здесь появится приглашение"></textarea><div class="row"><button class="mpb secondary" id="copyOffer">КОПИРОВАТЬ</button><button class="mpb secondary" id="shareOffer">ПОДЕЛИТЬСЯ</button></div><div id="hostStep2" style="display:none"><p>Друг пришлёт тебе ответ. Вставь его сюда:</p><textarea id="answerIn" placeholder="Ответ друга"></textarea><div class="row"><button class="mpb" id="hostAccept">2. ПРИНЯТЬ ОТВЕТ</button></div></div></div><div class="panel"><b>Если ТЫ подключаешься</b><p>Вставь приглашение от создателя:</p><textarea id="offerIn" placeholder="Приглашение друга"></textarea><div class="row"><button class="mpb" id="guestAnswer">СОЗДАТЬ ОТВЕТ</button></div><div id="guestStep2" style="display:none"><textarea id="answerOut" readonly placeholder="Твой ответ"></textarea><div class="row"><button class="mpb secondary" id="copyAnswer">КОПИРОВАТЬ</button><button class="mpb secondary" id="shareAnswer">ПОДЕЛИТЬСЯ</button></div></div></div><div id="mpstatus">Готов. Лучше, чтобы оба телефона были в горизонтальном режиме.</div></div>';document.body.appendChild(d);document.getElementById('hostCreate').onclick=mpHostCreate;document.getElementById('hostAccept').onclick=mpHostAccept;document.getElementById('guestAnswer').onclick=mpGuestAnswer;document.getElementById('copyOffer').onclick=()=>copyBox('offerOut');document.getElementById('copyAnswer').onclick=()=>copyBox('answerOut');document.getElementById('shareOffer').onclick=()=>shareBox('offerOut');document.getElementById('shareAnswer').onclick=()=>shareBox('answerOut')}\nmpUI();\n// ---- end native multiplayer ----\n";t=t.replace(/\}\)\(\);\s*<\/script>/,inject+'\n})();\n<\/script>');document.open();document.write(t);document.close()}catch(e){document.getElementById('s').innerHTML='<b>Не загрузилось :(</b><br><small>'+String(e)+'</small>'}})();</script></body></html>
