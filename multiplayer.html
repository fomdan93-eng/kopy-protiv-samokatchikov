<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111"><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><title>Копы против Самокатчиков — кооп</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui;display:grid;place-items:center}#s{text-align:center;padding:24px}small{opacity:.7}</style></head><body><div id="s"><b>Готовлю кооп…</b><br><small>Загружаю Китай-город</small></div><script>(async()=>{try{let t=await fetch('./index.html?v=9',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});t=t.replace(/<script>\s*if\('serviceWorker'[\s\S]*?<\/script>/,'');t=t.replace("devicePixelRatio||1","window.devicePixelRatio||1");t=t.replace("kind:'car',laneOffset:","kind:'car',routeDelay:rand(2.8),laneOffset:");t=t.replace("laneOffset:(Math.random()<.5?-9:9),kind:'bus'","routeDelay:rand(3.2),laneOffset:(Math.random()<.5?-9:9),kind:'bus'");t=t.replace("pathCooldown:rand(1),fallen:0,color:","pathCooldown:rand(1),routeDelay:rand(3.4),fallen:0,color:");t=t.replace(/function updateRoadVehicle\(v,dt,now\)\{[\s\S]*?\}\nfunction updateTraffic/,`function updateRoadVehicle(v,dt,now){if(!v.path||v.path.length<2){v.routeDelay=Math.max(0,(v.routeDelay||0)-dt);v.speed+=(0-v.speed)*Math.min(1,dt*4);if(v.routeDelay>0)return;const st=nearestRoadCell(v.x,v.y);let g=roadCells[randi(roadCells.length)];for(let tries=0;tries<12&&Math.abs(g.x-st.x)+Math.abs(g.y-st.y)<22;tries++)g=roadCells[randi(roadCells.length)];v.path=(typeof aStarRoadDirected==='function'?aStarRoadDirected(st,g,2200):aStar(st,g,roadAllowed,2200));v.routeDelay=.45+rand(1);if(!v.path||v.path.length<2)return}const curr=v.path[0],next=v.path[1],wp=worldFromCell(next);let tx=wp.x,ty=wp.y,ox=v.laneOffset||0;if(next.x!==curr.x)ty+=ox;else if(next.y!==curr.y)tx+=ox;const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy)||1,desired=Math.atan2(dy,dx);let da=((desired-v.angle+Math.PI*3)%(Math.PI*2))-Math.PI;v.angle+=clamp(da,-2*dt,2*dt);let target=(mustStopAtLight(v,now)||carAhead(v))?0:v.max;v.speed+=(target-v.speed)*Math.min(1,dt*2.8);v.vx=Math.cos(v.angle)*v.speed;v.vy=Math.sin(v.angle)*v.speed;moveRoadEntity(v,v.vx*dt,v.vy*dt);if(v.blocked){v.path=[];v.routeDelay=.7+rand(.9);v.speed*=.2;return}if(d<14)v.path.shift()}\nfunction updateTraffic`);t=t.replace(/p\.path=aStar\(s,goal,pedestrianAllowed,4200\)/g,"p.path=aStar(s,goal,pedestrianAllowed,1800)");t=t.replace(/c\.path=aStar\(nearestRoadCell\(c\.x,c\.y\),targetForCar\(c\),roadAllowed,6000\)/g,"c.path=aStar(nearestRoadCell(c.x,c.y),targetForCar(c),roadAllowed,2600)");const inject="\n// ---- Multiplayer runtime injected inside the game's IIFE ----\nconst MP={started:false,host:false,peer:null,conn:null,room:'',other:null,remote:{ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false},lastState:0,lastInput:0};\nconst _update=update,_reset=resetGame,_collide=collideEntities,_drawPlayer=drawPlayer,_targetForCar=targetForCar,_spawnFoot=maybeSpawnFootCop;\nfunction mpRiders(){return MP.other?[player,MP.other]:[player]}\nfunction mpNearest(x,y){let b=player,bd=Infinity;for(const r of mpRiders()){const d=(r.x-x)**2+(r.y-y)**2;if(d<bd){bd=d;b=r}}return b}\ntargetForCar=function(c){const r=mpNearest(c.x,c.y);let tx=r.x,ty=r.y;if(c.mode==='intercept'){tx+=r.vx*2.6;ty+=r.vy*2.6}else if(c.mode==='block'){tx+=r.vx*4;ty+=r.vy*4}return nearestRoadCell(tx,ty)};\nmaybeSpawnFootCop=function(c){if(c.spawnedCop)return;const r=mpNearest(c.x,c.y),d=Math.hypot(c.x-r.x,c.y-r.y),ps=tileAtWorld(r.x,r.y);if(d<180&&(d<90||ps===SIDEWALK||ps===PARK||ps===PATH||ps===PLAZA)){c.spawnedCop=true;const stamina=9.2+rand(1.6);footCops.push({x:c.x+Math.cos(c.angle+Math.PI/2)*22,y:c.y+Math.sin(c.angle+Math.PI/2)*22,r:9,speed:68,returnSpeed:52,vx:0,vy:0,stamina,maxStamina:stamina,returning:false,owner:c,path:[],pathT:0})}};\nfunction mpSpawnOther(){const p=worldFromCell(nearestScooterCell(player.x+80,player.y+30));MP.other={x:p.x,y:p.y,vx:0,vy:0,r:10,angle:0,max:150,accel:3.35,fallen:0,carHitCooldown:0,pedHitCooldown:0,slow:0}}\nfunction mpMove(r,k,dt){if(!r)return;if(r.carHitCooldown>0)r.carHitCooldown-=dt;if(r.pedHitCooldown>0)r.pedHitCooldown-=dt;if(r.slow>0)r.slow-=dt;if(r.fallen>0){r.fallen-=dt;r.vx=r.vy=0;return}const ix=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0),iy=(k.ArrowDown?1:0)-(k.ArrowUp?1:0),L=Math.hypot(ix,iy),surf=tileAtWorld(r.x,r.y);let mx=r.max;if(surf===PARK||surf===GRASS)mx*=.84;if(surf===PATH||surf===SIDEWALK||surf===PLAZA)mx*=.97;if(r.slow>0)mx*=.58;const sp=Math.hypot(r.vx,r.vy);if(L){const dx=ix/L,dy=iy/L,a=Math.atan2(dy,dx);let da=((a-r.angle+Math.PI*3)%(Math.PI*2))-Math.PI;r.angle+=da*Math.min(1,dt*11);const va=sp>4?Math.atan2(r.vy,r.vx):a,td=Math.abs(((a-va+Math.PI*3)%(Math.PI*2))-Math.PI),rain=weather&&weather.type==='rain'&&(surf===ROAD||surf===PARKING||surf===SIDEWALK)?.62:1,g=((sp>62&&td>.62)?1.36:r.accel)*rain,K=Math.min(1,g*dt);r.vx+=(dx*mx-r.vx)*K;r.vy+=(dy*mx-r.vy)*K}else{const dr=Math.pow(weather&&weather.type==='rain'?.969:.958,dt*60);r.vx*=dr;r.vy*=dr}const ns=Math.hypot(r.vx,r.vy);if(ns>mx){r.vx*=mx/ns;r.vy*=mx/ns}moveCircle(r,r.vx*dt,r.vy*dt)}\nfunction mpFall(r){if(r.carHitCooldown>0||r.fallen>0)return;r.fallen=2;r.carHitCooldown=2.35;r.vx=r.vy=0}\nfunction mpCheck(r){if(!r||gameOver)return;const onRoad=tileAtWorld(r.x,r.y)===ROAD;for(const c of policeCars)if((onRoad||r.fallen>0)&&Math.hypot(r.x-c.x,r.y-c.y)<r.r+c.r+3)return lose('ОДНОГО ИЗ ВАС ПОЙМАЛИ');for(const f of footCops)if(!f.returning&&Math.hypot(r.x-f.x,r.y-f.y)<r.r+f.r+2)return lose('ОДНОГО ИЗ ВАС ДОГНАЛ КОП');for(const t of traffic.concat(buses))if(Math.hypot(r.x-t.x,r.y-t.y)<r.r+t.r+3){mpFall(r);return}if(r.fallen<=0&&r.pedHitCooldown<=0)for(const p of pedestrians)if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+p.r+3){r.vx*=.28;r.vy*=.28;r.slow=.95;r.pedHitCooldown=.8;p.stun=.6;break}}\ncollideEntities=function(){_collide();if(!gameOver&&MP.other)mpCheck(MP.other)};\nfunction mpDrawOther(){const r=MP.other;if(!r)return;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-13,0,5,0,Math.PI*2);ctx.arc(14,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#22b8cf';ctx.fillRect(-10,-4,19,8);ctx.strokeStyle='#343434';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(13,0);ctx.stroke();ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(11,-8);ctx.lineTo(11,8);ctx.stroke();ctx.fillStyle='#f1c7a5';ctx.beginPath();ctx.arc(-2,0,5.5,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.fillStyle='#111d';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText('ДРУГ',r.x,r.y-20);ctx.restore()}\ndrawPlayer=function(){_drawPlayer();mpDrawOther()};\nfunction mpSlim(a,fs){return a.map(o=>{const z={};for(const f of fs)z[f]=o[f];return z})}\nfunction mpR(r){return r?{x:r.x,y:r.y,vx:r.vx,vy:r.vy,angle:r.angle,fallen:r.fallen,slow:r.slow,carHitCooldown:r.carHitCooldown,pedHitCooldown:r.pedHitCooldown,r:r.r,max:r.max,accel:r.accel}:null}\nfunction mpState(now){return{t:'s',e:(gameOver?endTime:now)-startTime,g:gameOver,w:weather,a:mpR(player),b:mpR(MP.other),pc:mpSlim(policeCars,['x','y','angle','r','mode']),fc:mpSlim(footCops,['x','y','r','stamina','maxStamina','returning']),tr:mpSlim(traffic,['x','y','angle','r','color']),bu:mpSlim(buses,['x','y','angle','r']),pe:mpSlim(pedestrians,['x','y','r','shirt','skin']),sc:mpSlim(npcScooters,['x','y','r','angle','fallen','color'])}}\nfunction mpCopy(dst,s,soft){if(!s)return dst;if(!dst)dst={...s};if(soft){const d=Math.hypot(dst.x-s.x,dst.y-s.y),q=d>120?1:.35;dst.x+=(s.x-dst.x)*q;dst.y+=(s.y-dst.y)*q;dst.vx=s.vx;dst.vy=s.vy;dst.angle=s.angle}else Object.assign(dst,s);dst.r=s.r||10;dst.max=s.max||150;dst.accel=s.accel||3.35;dst.fallen=s.fallen||0;return dst}\nfunction mpApply(s){weather=s.w||weather;gameOver=!!s.g;startTime=performance.now()-(s.e||0);if(gameOver)endTime=performance.now();player=mpCopy(player,s.b,true);MP.other=mpCopy(MP.other,s.a,false);policeCars=s.pc||[];footCops=s.fc||[];traffic=s.tr||[];buses=s.bu||[];pedestrians=s.pe||[];npcScooters=s.sc||[]}\nfunction mpSendInit(){if(MP.conn&&MP.conn.open)MP.conn.send({t:'i',o:objects,s:mpState(performance.now())})}\nresetGame=function(){if(MP.started&&!MP.host){if(MP.conn&&MP.conn.open)MP.conn.send({t:'r'});return}_reset();if(MP.started&&MP.host){mpSpawnOther();mpSendInit()}};\nupdate=function(dt,now){if(!MP.started)return;if(MP.host){if(!gameOver){mpMove(MP.other,MP.remote,dt);_update(dt,now)}if(MP.conn&&MP.conn.open&&now-MP.lastState>125){MP.lastState=now;MP.conn.send(mpState(now))}}else{if(!gameOver)updatePlayer(dt);if(MP.conn&&MP.conn.open&&now-MP.lastInput>50){MP.lastInput=now;MP.conn.send({t:'k',u:!!keys.ArrowUp,d:!!keys.ArrowDown,l:!!keys.ArrowLeft,r:!!keys.ArrowRight})}}};\nfunction mpUI(){const s=document.createElement('style');s.textContent='#mpl{position:fixed;inset:0;z-index:999;background:#0d1116ee;color:#fff;display:grid;place-items:center;font-family:system-ui}#mpc{width:min(430px,90vw);background:#171c23;padding:24px;border-radius:22px;border:1px solid #ffffff22;box-shadow:0 25px 70px #0009}#mpc h2{margin:0 0 8px}#mpc p{color:#bbc3ce;font-size:14px}#mpc button,#mpc input{height:48px;border:0;border-radius:13px;font-weight:800}#mpc button{background:#ed5a32;color:#fff;padding:0 16px}#mpc input{background:#0d1116;color:#fff;padding:0 12px;flex:1;font-size:18px;letter-spacing:3px;text-transform:uppercase}.mpr{display:flex;gap:8px;margin-top:10px}#mpcode{text-align:center;color:#ffd66b;font:900 34px system-ui;letter-spacing:5px;margin:12px}#mpstatus{font-size:13px;color:#c8d0da;margin-top:12px}';document.head.appendChild(s);const d=document.createElement('div');d.id='mpl';d.innerHTML='<div id="mpc"><h2>Кооп на двоих</h2><p>Один создаёт комнату, второй вводит код. Если поймали любого — проиграли оба.</p><button id="mph" style="width:100%">СОЗДАТЬ КОМНАТУ</button><div id="mpcode"></div><div class="mpr"><input id="mpi" maxlength="6" placeholder="КОД"><button id="mpj">ВОЙТИ</button></div><div id="mpstatus">Готов к соединению.</div></div>';document.body.appendChild(d);document.getElementById('mph').onclick=mpHost;document.getElementById('mpj').onclick=mpJoin}\nfunction mpStatus(x){document.getElementById('mpstatus').textContent=x}function mpHide(){document.getElementById('mpl').remove();showMsg('МУЛЬТИПЛЕЕР: '+MP.room,1800)}function mpCode(){const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(6);crypto.getRandomValues(a);return Array.from(a,n=>C[n%C.length]).join('')}\nfunction mpBindHost(c){MP.conn=c;c.on('open',()=>{MP.started=true;resetGame();mpHide();mpSendInit()});c.on('data',d=>{if(d.t==='k')MP.remote={ArrowUp:d.u,ArrowDown:d.d,ArrowLeft:d.l,ArrowRight:d.r};if(d.t==='r')resetGame()});c.on('close',()=>showMsg('ДРУГ ОТКЛЮЧИЛСЯ',2000))}\nfunction mpHost(){if(typeof Peer==='undefined')return mpStatus('Сеть не загрузилась. Обнови страницу.');MP.host=true;MP.room=mpCode();MP.peer=new Peer('kpsmoscow-'+MP.room.toLowerCase());MP.peer.on('open',()=>{document.getElementById('mpcode').textContent=MP.room;mpStatus('Отправь код другу и жди.')});MP.peer.on('connection',mpBindHost);MP.peer.on('error',e=>mpStatus('Ошибка: '+(e.type||e.message)))}\nfunction mpJoin(){if(typeof Peer==='undefined')return mpStatus('Сеть не загрузилась. Обнови страницу.');MP.host=false;MP.room=document.getElementById('mpi').value.trim().toUpperCase();if(MP.room.length<4)return mpStatus('Введи код комнаты.');MP.peer=new Peer();MP.peer.on('open',()=>{MP.conn=MP.peer.connect('kpsmoscow-'+MP.room.toLowerCase(),{reliable:true});MP.conn.on('open',()=>{MP.started=true;mpHide()});MP.conn.on('data',d=>{if(d.t==='i'){if(d.o)objects=d.o;if(d.s)mpApply(d.s)}else if(d.t==='s')mpApply(d)});MP.conn.on('close',()=>showMsg('СВЯЗЬ ПОТЕРЯНА',2000))});MP.peer.on('error',e=>mpStatus('Ошибка: '+(e.type==='peer-unavailable'?'комната не найдена':(e.type||e.message))))}\nmpUI();\n// ---- end multiplayer ----\n";t=t.replace(/\}\)\(\);\s*<\/script>/,inject+'\n})();\n<\/script>');document.open();document.write(t);document.close()}catch(e){document.getElementById('s').innerHTML='<b>Не загрузилось :(</b><br><small>'+String(e)+'</small>'}})();</script></body></html>
