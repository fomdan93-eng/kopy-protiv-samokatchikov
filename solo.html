<style>

<canvas id="c"></canvas><div id="joy"><div id="stick"></div></div><button id="restart">RESTART</button><div id="rotate"><div><b>↻</b>Поверни iPhone горизонтально</div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),g=c.getContext('2d'),joy=document.getElementById('joy'),stick=document.getElementById('stick'),restart=document.getElementById('restart');
let dpr=Math.min(2,window.devicePixelRatio||1);function resize(){c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const W=2200,H=1600;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const roads=[
{x:0,y:170,w:W,h:160,name:'Театральный проезд'},{x:0,y:590,w:W,h:150,name:'Ильинка'},{x:0,y:1010,w:W,h:150,name:'Варварка'},{x:0,y:1370,w:W,h:150,name:'Москворецкая набережная'},
{x:210,y:0,w:150,h:H,name:'Москворецкая ул.'},{x:720,y:0,w:135,h:H,name:'Черкасский пер.'},{x:1260,y:0,w:150,h:H,name:'Китайгородский пр.'},{x:1780,y:0,w:170,h:H,name:'Лубянский пр.'}
];
const park={x:1420,y:790,w:620,h:520};
const buildings=[
{x:390,y:360,w:280,h:180},{x:900,y:355,w:300,h:190},{x:1450,y:350,w:280,h:190},{x:1970,y:345,w:180,h:200},
{x:390,y:790,w:260,h:165},{x:900,y:785,w:300,h:170},{x:390,y:1200,w:260,h:130},{x:900,y:1205,w:300,h:120},{x:1980,y:1200,w:160,h:130},
{x:35,y:360,w:130,h:180},{x:35,y:790,w:130,h:170},{x:35,y:1200,w:130,h:130}
];
const nodes=[];const xs=[285,787,1335,1865],ys=[250,665,1085,1445];for(let yi=0;yi<ys.length;yi++)for(let xi=0;xi<xs.length;xi++)nodes.push({x:xs[xi],y:ys[yi],xi,yi});
function node(xi,yi){return nodes[yi*xs.length+xi]}function neigh(n){const a=[];if(n.xi>0)a.push(node(n.xi-1,n.yi));if(n.xi<xs.length-1)a.push(node(n.xi+1,n.yi));if(n.yi>0)a.push(node(n.xi,n.yi-1));if(n.yi<ys.length-1)a.push(node(n.xi,n.yi+1));return a}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}function onRoad(x,y){return roads.some(r=>inRect(x,y,r))}function hitsBuilding(x,y,rad=8){return buildings.some(b=>x+rad>b.x&&x-rad<b.x+b.w&&y+rad>b.y&&y-rad<b.y+b.h)}
function moveSafe(o,dx,dy,roadOnly=false){let nx=o.x+dx,ny=o.y;if(!hitsBuilding(nx,ny,o.r||8)&&(!roadOnly||onRoad(nx,ny)))o.x=nx;else{o.vx=0}nx=o.x;ny=o.y+dy;if(!hitsBuilding(nx,ny,o.r||8)&&(!roadOnly||onRoad(nx,ny)))o.y=ny;else{o.vy=0}}
let keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false},joyId=null;function joyMove(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const m=42,d=Math.hypot(dx,dy)||1,q=Math.min(1,m/d);dx*=q;dy*=q;stick.style.transform=`translate(${dx}px,${dy}px)`;keys.ArrowLeft=dx<-10;keys.ArrowRight=dx>10;keys.ArrowUp=dy<-10;keys.ArrowDown=dy>10}function joyClear(){keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture?.(joyId);joyMove(e.clientX,e.clientY);e.preventDefault()});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e.clientX,e.clientY);e.preventDefault()}});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;joyClear();e.preventDefault()}});joy.addEventListener('pointercancel',()=>{joyId=null;joyClear()});
addEventListener('keydown',e=>{if(e.key in keys){keys[e.key]=true;e.preventDefault()}if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>{if(e.key in keys)keys[e.key]=false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let player,traffic,buses,scooters,peds,civilMotos,police,policeMotos,cops,weather,weatherAt,start,lastLevel,over,best=Number(localStorage.kps_solo_best||0),msg='',msgUntil=0;
function entities(){return [player,...(traffic||[]),...(buses||[]),...(scooters||[]),...(peds||[]),...(civilMotos||[]),...(police||[]),...(policeMotos||[]),...(cops||[])].filter(Boolean)}
function spotFree(x,y,r,extra=8,ignore=null){if(x<r+5||y<r+5||x>W-r-5||y>H-r-5||hitsBuilding(x,y,r+2))return false;for(const o of entities()){if(o===ignore)continue;const rr=r+(o.r||8)+extra;if((o.x-x)**2+(o.y-y)**2<rr*rr)return false}return true}
function freePoint(r,roadOnly=false,minPlayer=0){for(let i=0;i<180;i++){const x=rnd(50,W-50),y=rnd(50,H-50);if(roadOnly&&!onRoad(x,y))continue;if(player&&minPlayer&&Math.hypot(x-player.x,y-player.y)<minPlayer)continue;if(spotFree(x,y,r,10))return{x,y}}return{x:285,y:250}}
function roadSpawn(kind,minPlayer=0){const r=kind==='bus'?19:(kind==='police'?17:(kind.includes('Moto')?10:13));for(let i=0;i<160;i++){const n=nodes[(Math.random()*nodes.length)|0],ns=neigh(n),to=ns[(Math.random()*ns.length)|0],p=rnd(.1,.9),x=n.x+(to.x-n.x)*p,y=n.y+(to.y-n.y)*p;if(player&&minPlayer&&Math.hypot(x-player.x,y-player.y)<minPlayer)continue;if(!spotFree(x,y,r,12))continue;return{n,to,p,x,y,r}}const n=nodes[0],to=neigh(n)[0];return{n,to,p:.5,x:(n.x+to.x)/2,y:(n.y+to.y)/2,r}}
function makeRoadUnit(kind){const s=roadSpawn(kind,kind==='police'?520:0),speed=kind==='bus'?34:(kind==='civilMoto'?rnd(96,122):(kind==='policeMoto'?rnd(112,138):rnd(42,58)));return{x:s.x,y:s.y,r:s.r,node:s.n,to:s.to,progress:s.p,speed,baseSpeed:speed,kind,fall:0,angle:Math.atan2(s.to.y-s.n.y,s.to.x-s.n.x),color:['#858c92','#b7b3aa','#586875','#9b3e40','#d8dade'][Math.random()*5|0]}}
function pickNext(v,target){v.node=v.to;let ns=neigh(v.node);if(target){ns.sort((a,b)=>Math.hypot(a.x-target.x,a.y-target.y)-Math.hypot(b.x-target.x,b.y-target.y));v.to=ns[0]}else v.to=ns[(Math.random()*ns.length)|0];v.angle=Math.atan2(v.to.y-v.node.y,v.to.x-v.node.x);v.progress=0}
function driveRoad(v,dt,target){if(v.fall>0)return;const dx=v.to.x-v.node.x,dy=v.to.y-v.node.y,len=Math.hypot(dx,dy)||1;v.progress+=v.speed*dt/len;if(v.progress>=1){v.x=v.to.x;v.y=v.to.y;pickNext(v,target);return}const nx=v.node.x+dx*v.progress,ny=v.node.y+dy*v.progress;v.angle=Math.atan2(dy,dx);if(!hitsBuilding(nx,ny,v.r)){v.x=nx;v.y=ny}else pickNext(v,target)}
function makePolice(){const p=makeRoadUnit('police');p.copOut=false;return p}function makeCivilMoto(){const m=makeRoadUnit('civilMoto');m.color=['#ee8b2d','#4fa3e3','#5fbf7a','#d84f5f'][Math.random()*4|0];return m}function makePoliceMoto(){const m=makeRoadUnit('policeMoto');m.color='#245fae';return m}
function makeScooter(){const p=freePoint(8,false,100);return{x:p.x,y:p.y,vx:rnd(-45,45),vy:rnd(-45,45),r:8,fall:0,color:['#ffb52d','#4da6ff','#55c878','#e76552','#b06dde'][Math.random()*5|0]}}
function makePed(){const p=freePoint(5,false,80);return{x:p.x,y:p.y,vx:rnd(-20,20),vy:rnd(-20,20),r:5}}
function reset(){traffic=[];buses=[];scooters=[];peds=[];civilMotos=[];police=[];policeMotos=[];cops=[];player={x:787,y:1085,vx:0,vy:0,angle:0,r:11,max:155,fall:0,slow:0};for(let i=0;i<12;i++)traffic.push(makeRoadUnit('car'));for(let i=0;i<2;i++)buses.push(makeRoadUnit('bus'));for(let i=0;i<16;i++)scooters.push(makeScooter());for(let i=0;i<14;i++)peds.push(makePed());for(let i=0;i<3;i++)civilMotos.push(makeCivilMoto());police.push(makePolice(),makePolice());weather='clear';weatherAt=performance.now()+25000;start=performance.now();lastLevel=1;over=false;msg='КИТАЙ-ГОРОД. УЕЗЖАЙ.';msgUntil=performance.now()+1800}
function updatePlayer(dt){if(player.fall>0){player.fall-=dt;player.vx=player.vy=0;return}if(player.slow>0)player.slow-=dt;let ix=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),iy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),L=Math.hypot(ix,iy),mx=player.max*(player.slow>0?.55:1);if(inRect(player.x,player.y,park))mx*=.92;const sp=Math.hypot(player.vx,player.vy);if(L){ix/=L;iy/=L;const a=Math.atan2(iy,ix),va=sp>3?Math.atan2(player.vy,player.vx):a,turn=Math.abs(((a-va+Math.PI*3)%(Math.PI*2))-Math.PI),grip=(weather==='rain'?1.0:2.0)*(turn>.6&&sp>60?.65:1),k=Math.min(1,grip*dt);player.vx+=(ix*mx-player.vx)*k;player.vy+=(iy*mx-player.vy)*k;player.angle=a}else{const drag=Math.pow(weather==='rain'?.973:.955,dt*60);player.vx*=drag;player.vy*=drag}const ns=Math.hypot(player.vx,player.vy);if(ns>mx){player.vx*=mx/ns;player.vy*=mx/ns}moveSafe(player,player.vx*dt,player.vy*dt,false)}
function updateScooters(dt){for(const s of scooters){if(s.fall>0){s.fall-=dt;continue}if(Math.random()<.015){s.vx+=rnd(-45,45);s.vy+=rnd(-45,45);const m=Math.hypot(s.vx,s.vy)||1;if(m>90){s.vx=s.vx/m*90;s.vy=s.vy/m*90}}const ox=s.x,oy=s.y;moveSafe(s,s.vx*dt,s.vy*dt,false);if(s.x===ox&&s.y===oy){s.vx*=-1;s.vy*=-1;s.fall=.5}for(const v of traffic.concat(buses,police,civilMotos,policeMotos))if(v.fall<=0&&dist(s,v)<s.r+v.r){s.fall=2;s.vx=s.vy=0;break}}}
function updatePeds(dt){for(const p of peds){if(Math.random()<.01){p.vx=rnd(-24,24);p.vy=rnd(-24,24)}const ox=p.x,oy=p.y;moveSafe(p,p.vx*dt,p.vy*dt,false);if(p.x===ox&&p.y===oy){p.vx*=-1;p.vy*=-1}}}
function motoFall(m){if(m.fall>0)return;m.fall=2;m.speed=m.baseSpeed}
function updateCivilMotos(dt){for(const m of civilMotos){if(m.fall>0){m.fall-=dt;continue}driveRoad(m,dt);for(const v of traffic.concat(buses,police,policeMotos,civilMotos)){if(v===m||v.fall>0)continue;if(dist(m,v)<m.r+v.r+1){motoFall(m);if(v.kind&&v.kind.includes('Moto'))motoFall(v);break}}}}
function spawnCop(car){if(car.copOut)return;const a=car.angle+Math.PI/2;let pos=null;for(const side of [1,-1,1.6,-1.6]){const x=car.x+Math.cos(a)*26*side,y=car.y+Math.sin(a)*26*side;if(spotFree(x,y,9,3,car)){pos={x,y};break}}if(!pos)return;car.copOut=true;cops.push({x:pos.x,y:pos.y,r:9,life:10,returning:false,car,angle:car.angle})}
function updatePolice(dt){for(const p of police){driveRoad(p,dt,player);if(dist(p,player)<190&&!onRoad(player.x,player.y))spawnCop(p)}for(let i=cops.length-1;i>=0;i--){const cp=cops[i];if(!cp.returning){cp.life-=dt;if(cp.life<=0)cp.returning=true}const t=cp.returning?cp.car:player,dx=t.x-cp.x,dy=t.y-cp.y,d=Math.hypot(dx,dy)||1;cp.angle=Math.atan2(dy,dx);moveSafe(cp,dx/d*(cp.returning?56:70)*dt,dy/d*(cp.returning?56:70)*dt,false);if(cp.returning&&dist(cp,cp.car)<25){cp.car.copOut=false;cops.splice(i,1)}}}
function updatePoliceMotos(dt){for(const m of policeMotos){if(m.fall>0){m.fall-=dt;continue}driveRoad(m,dt,player);for(const v of traffic.concat(buses,police,civilMotos,policeMotos)){if(v===m||v.fall>0)continue;if(dist(m,v)<m.r+v.r+1){motoFall(m);if(v.kind&&v.kind.includes('Moto'))motoFall(v);break}}}}
function fall(){if(player.fall<=0){player.fall=2;player.vx=player.vy=0;msg='ПАДЕНИЕ! 2 СЕКУНДЫ';msgUntil=performance.now()+1000}}
function lose(t){if(over)return;over=true;msg=t;const tm=(performance.now()-start)/1000;if(tm>best){best=tm;localStorage.kps_solo_best=best}}
function collide(){if(over)return;for(const p of police)if((onRoad(player.x,player.y)||player.fall>0)&&dist(player,p)<player.r+p.r+2)return lose('ТЕБЯ ПОЙМАЛА ПОЛИЦИЯ');for(const cp of cops)if(!cp.returning&&dist(player,cp)<player.r+cp.r+1)return lose('ТЕБЯ ДОГНАЛ ПОЛИЦЕЙСКИЙ');for(const v of traffic.concat(buses))if(dist(player,v)<player.r+v.r+2){fall();break}for(const m of civilMotos.concat(policeMotos)){if(m.fall<=0&&dist(player,m)<player.r+m.r+2){motoFall(m);fall();break}}if(player.fall<=0)for(const p of peds)if(dist(player,p)<player.r+p.r+2){player.vx*=.35;player.vy*=.35;player.slow=.7;break}}
function advanceLevel(level,now){police.push(makePolice());let text='УРОВЕНЬ '+level+': +1 ЭКИПАЖ';if(level>=3&&level%2===1){policeMotos.push(makePoliceMoto());text+=' + МОТОПАТРУЛЬ'}msg=text;msgUntil=now+1900}
function update(dt,now){if(over)return;updatePlayer(dt);for(const v of traffic)driveRoad(v,dt);for(const b of buses)driveRoad(b,dt);updateScooters(dt);updatePeds(dt);updateCivilMotos(dt);updatePolice(dt);updatePoliceMotos(dt);collide();if(now>weatherAt){weather=weather==='rain'?'clear':(Math.random()<.6?'rain':'clear');weatherAt=now+rnd(26000,42000);msg=weather==='rain'?'ДОЖДЬ: ЗАНОС СИЛЬНЕЕ':'ПОГОДА ПРОЯСНИЛАСЬ';msgUntil=now+1600}const level=Math.floor((now-start)/60000)+1;while(lastLevel<level){lastLevel++;advanceLevel(lastLevel,now)}}
function drawRoads(){g.fillStyle='#aeb8a5';g.fillRect(0,0,W,H);g.fillStyle='#4f545a';for(const r of roads)g.fillRect(r.x,r.y,r.w,r.h);g.save();g.strokeStyle='#e8e8e0';g.lineWidth=2;g.setLineDash([16,16]);for(const r of roads){g.beginPath();if(r.w>r.h){g.moveTo(r.x,r.y+r.h/2);g.lineTo(r.x+r.w,r.y+r.h/2)}else{g.moveTo(r.x+r.w/2,r.y);g.lineTo(r.x+r.w/2,r.y+r.h)}g.stroke()}g.restore();g.fillStyle='#84a66f';g.fillRect(park.x,park.y,park.w,park.h);g.strokeStyle='#d5c8a3';g.lineWidth=26;g.beginPath();g.moveTo(park.x+40,park.y+80);g.lineTo(park.x+park.w-50,park.y+park.h-70);g.moveTo(park.x+park.w-80,park.y+50);g.lineTo(park.x+70,park.y+park.h-50);g.stroke();for(const b of buildings){g.fillStyle='#c8b9aa';g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#8e7766';g.fillRect(b.x,b.y,b.w,7);g.fillStyle='#f1e8d9';for(let x=b.x+18;x<b.x+b.w-15;x+=34)for(let y=b.y+25;y<b.y+b.h-20;y+=34)g.fillRect(x,y,10,14)}g.fillStyle='#769eb3';g.fillRect(0,1530,W,70);g.fillStyle='#ffffff66';g.font='700 18px system-ui';for(const r of roads){if(r.w>r.h)g.fillText(r.name,r.x+30,r.y+28)}}
function car(v,pol=false){g.save();g.translate(v.x,v.y);g.rotate(v.angle);if(v.kind==='bus'){g.fillStyle='#2f79b6';g.fillRect(-30,-10,60,20);g.fillStyle='#dce8ef';g.fillRect(-21,-8,29,6)}else{g.fillStyle=pol?'#f4f4f4':v.color||'#8b9299';g.fillRect(-17,-9,34,18);g.fillStyle=pol?'#245fae':'#29333c';g.fillRect(-8,-7,13,14);if(pol){g.fillStyle='#245fae';g.fillRect(-17,3,34,5);g.fillStyle='#e33';g.fillRect(-4,-11,4,3);g.fillStyle='#36f';g.fillRect(1,-11,4,3)}}g.restore()}
function scoot(s,me=false){g.save();g.translate(s.x,s.y);g.rotate(me?player.angle:Math.atan2(s.vy||0,s.vx||1));if((me?player.fall:s.fall)>0)g.rotate(.7);g.fillStyle='#111';g.beginPath();g.arc(-10,0,4,0,Math.PI*2);g.arc(10,0,4,0,Math.PI*2);g.fill();g.fillStyle=me?'#ef5d2f':s.color;g.fillRect(-7,-3,14,6);g.strokeStyle='#333';g.lineWidth=2;g.beginPath();g.moveTo(7,0);g.lineTo(10,0);g.moveTo(9,-6);g.lineTo(9,6);g.stroke();g.fillStyle='#efc7a7';g.beginPath();g.arc(-1,0,4,0,Math.PI*2);g.fill();g.restore()}
function moto(m,pol=false){g.save();g.translate(m.x,m.y);g.rotate(m.angle+(m.fall>0?.75:0));g.fillStyle='#151515';g.beginPath();g.arc(-9,0,4.5,0,Math.PI*2);g.arc(10,0,4.5,0,Math.PI*2);g.fill();g.fillStyle=pol?'#245fae':m.color;g.fillRect(-6,-4,13,8);g.fillStyle='#d9d9d9';g.fillRect(4,-2,8,4);g.fillStyle=pol?'#eef4ff':'#252525';g.beginPath();g.arc(-1,0,5,0,Math.PI*2);g.fill();if(pol){g.fillStyle='#e33';g.fillRect(-3,-8,3,3);g.fillStyle='#36f';g.fillRect(1,-8,3,3)}g.restore()}
function footCop(cp){g.save();g.translate(cp.x,cp.y);g.rotate(cp.angle);g.fillStyle=cp.returning?'#7a7f85':'#244d7e';g.fillRect(-5,-7,10,14);g.fillStyle='#efc3a0';g.beginPath();g.arc(0,-10,4.5,0,Math.PI*2);g.fill();g.fillStyle='#17283d';g.fillRect(-5,-14,10,3);g.fillStyle='#111';g.fillRect(-6,6,4,7);g.fillRect(2,6,4,7);g.strokeStyle='#d7e6f7';g.lineWidth=1;g.strokeRect(-5,-7,10,14);g.restore()}
function draw(now){const cx=clamp(player.x-innerWidth/2,0,W-innerWidth),cy=clamp(player.y-innerHeight/2,0,H-innerHeight);g.clearRect(0,0,innerWidth,innerHeight);g.save();g.translate(-cx,-cy);drawRoads();for(const p of peds){g.fillStyle='#4a6578';g.beginPath();g.arc(p.x,p.y,5,0,Math.PI*2);g.fill()}for(const s of scooters)scoot(s);for(const m of civilMotos)moto(m,false);for(const v of traffic)car(v);for(const b of buses)car(b);for(const p of police)car(p,true);for(const m of policeMotos)moto(m,true);for(const cp of cops)footCop(cp);scoot(player,true);if(weather==='rain'){g.strokeStyle='#d9e8f055';g.lineWidth=1;for(let i=0;i<90;i++){const x=cx+((i*83+now/5)%(innerWidth+40)),y=cy+((i*47+now/3)%(innerHeight+40));g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+13);g.stroke()}}g.restore();const t=(now-start)/1000,level=Math.floor(t/60)+1;g.fillStyle='#111d';g.fillRect(12,12,245,106);g.fillStyle='#fff';g.font='800 19px system-ui';g.fillText(`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} · ур. ${level}`,25,39);g.font='12px system-ui';g.fillText(`Экипажи: ${police.length} · мотопатруль: ${policeMotos.length}`,25,60);g.fillText(`Гражд. мото: ${civilMotos.length} · пеших: ${cops.length}`,25,80);g.fillText(`Погода: ${weather==='rain'?'дождь':'ясно'} · рекорд ${best.toFixed(0)}с`,25,100);if(player.fall>0){g.fillStyle='#8b1e1edd';g.fillRect(12,128,210,35);g.fillStyle='#fff';g.font='800 13px system-ui';g.fillText(`ПОДЪЁМ ЧЕРЕЗ ${player.fall.toFixed(1)} С`,25,151)}if(now<msgUntil){g.fillStyle='#111e';g.fillRect(innerWidth/2-175,12,350,38);g.fillStyle='#fff';g.textAlign='center';g.font='800 14px system-ui';g.fillText(msg,innerWidth/2,37);g.textAlign='left'}if(over){g.fillStyle='#000b';g.fillRect(0,0,innerWidth,innerHeight);g.fillStyle='#fff';g.textAlign='center';g.font='900 38px system-ui';g.fillText('GAME OVER',innerWidth/2,innerHeight/2-30);g.font='16px system-ui';g.fillText('Нажми RESTART',innerWidth/2,innerHeight/2+15);g.textAlign='left'}}
restart.addEventListener('click',reset);let last=performance.now();reset();function loop(now){const dt=Math.min(.034,(now-last)/1000);last=now;update(dt,now);draw(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
